name: Apply calculation de-minimis hotfix

on:
  push:
    branches:
      - fix/calculation-deminimis-parity

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message == 'chore: apply calculation de-minimis hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calculation-deminimis-parity
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Patch Engine 1 de-minimis policy and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          for path in [
              'lib/cost-structure/calculations/company-2000.ts',
              'lib/cost-structure/calculations/company-7000.ts',
          ]:
              replace_once(
                  path,
                  "import { Prisma } from '@prisma/client';\n",
                  "import { Prisma } from '@prisma/client';\nimport { isMappingBlockingAmount } from '../reconciliation/money';\n",
              )
              replace_once(
                  path,
                  "if (line.disposition === 'UNMAPPED' && line.amount.isZero()) continue;",
                  "if (line.disposition === 'UNMAPPED' && !isMappingBlockingAmount(line.amount.toString())) continue;",
              )

          p = Path('lib/cost-structure/calculations/company-2000.test.ts')
          text = p.read_text()
          marker = "\ntest('source-specific 676 mapping keeps ADUM tax while PASAR rolls into UUA', () => {"
          if text.count(marker) != 1:
              raise SystemExit('company-2000.test.ts insertion marker not unique')
          addition = """

test('absolute Rp1 unmapped is de-minimis while Rp1.01 remains blocking', () => {
  const result = calculateCompany2000({ sourceLines: [line({ disposition: 'UNMAPPED', applicableMappingCount: 0, amount: d('-1') })] });
  assert.equal(result.actualLines.length, 0);
  assert.equal(result.companyTotal.toString(), '0');
  assert.throws(() => calculateCompany2000({ sourceLines: [line({ disposition: 'UNMAPPED', applicableMappingCount: 0, amount: d('1.01') })] }), /no effective mapping/);
});
"""
          p.write_text(text.replace(marker, addition + marker, 1))

          replace_once(
              'lib/cost-structure/calculations/company-7000.test.ts',
              "line('ADUM', 101, 'N01', '0', { disposition: 'UNMAPPED', applicableMappingCount: 0 }))",
              "line('ADUM', 101, 'N01', '0', { disposition: 'UNMAPPED', applicableMappingCount: 0 }), line('ADUM', 101, 'N01', '-1', { disposition: 'UNMAPPED', applicableMappingCount: 0 }))",
          )
          replace_once(
              'lib/cost-structure/calculations/company-7000.test.ts',
              "unknown.sourceLines.push(line('ADUM', 101, 'N01', '1', { disposition: 'UNMAPPED', applicableMappingCount: 0 }))",
              "unknown.sourceLines.push(line('ADUM', 101, 'N01', '1.01', { disposition: 'UNMAPPED', applicableMappingCount: 0 }))",
          )
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Cost Structure tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commit tested hotfix and remove temporary workflow
        run: |
          git rm .github/workflows/apply-deminimis-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/cost-structure/calculations/company-2000.ts \
                  lib/cost-structure/calculations/company-7000.ts \
                  lib/cost-structure/calculations/company-2000.test.ts \
                  lib/cost-structure/calculations/company-7000.test.ts
          git commit -m 'fix(calculation): honor Rp1 de-minimis mapping policy'
          git push origin HEAD:fix/calculation-deminimis-parity
